name: Release

on:
  push:
    tags: ["v*"]

permissions:
  contents: write

jobs:
  build:
    strategy:
      matrix:
        include:
          - { os: macos-latest, target: aarch64-apple-darwin, name: melodl-macos-arm64 }
          - { os: macos-13, target: x86_64-apple-darwin, name: melodl-macos-x64 }
          - { os: ubuntu-latest, target: x86_64-unknown-linux-gnu, name: melodl-linux-x64 }
          - { os: windows-latest, target: x86_64-pc-windows-msvc, name: melodl-windows-x64.exe }
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          target: ${{ matrix.target }}
      - uses: Swatinem/rust-cache@v2
      - run: cargo build --release --features cli --target ${{ matrix.target }}
      - name: Package
        shell: bash
        run: |
          mkdir -p dist
          BIN="target/${{ matrix.target }}/release/melodl"
          [ -f "$BIN.exe" ] && BIN="$BIN.exe"
          cp "$BIN" "dist/${{ matrix.name }}"
          tar -czf "dist/${{ matrix.name }}.tar.gz" -C dist "${{ matrix.name }}"
      - uses: softprops/action-gh-release@v2
        with:
          files: dist/*.tar.gz
